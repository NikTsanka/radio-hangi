[versions]
# --- Build tooling (kept from the generated scaffold) ---
agp = "9.2.1"                      # Android Gradle Plugin (ships built-in Kotlin support)
kotlin = "2.4.0"                  # Kotlin compiler + compose/serialization plugins
composeBom = "2026.05.01"          # Single source of truth for all androidx.compose.* versions

# --- AndroidX runtime (bumped from scaffold defaults to match the 2026 Compose BOM) ---
coreKtx = "1.19.0"                 # Kotlin extensions over the Android framework
coreSplashscreen = "1.2.0"         # Backported Android 12 splash screen API (API 23+)
activityCompose = "1.13.0"          # ComponentActivity + setContent {} integration
lifecycleRuntimeKtx = "2.10.0"      # Lifecycle coroutines, ViewModel, collectAsStateWithLifecycle

# --- Navigation ---
navigationCompose = "2.9.8"        # Single-activity Navigation-Compose (Screen A / Screen B)

# --- Media3 (modern replacement for MediaPlayer / MediaSessionCompat) ---
media3 = "1.10.1"                   # ExoPlayer + MediaSessionService + media notification

# --- Networking + JSON ---
retrofit = "3.0.0"                # Typed HTTP clients for Deezer / lyrics.ovh / Radio Browser
okhttp = "5.4.0"                  # HTTP engine; also provides the SSE client for Zeno metadata
kotlinxSerialization = "1.11.0"     # @Serializable models + JSON parsing (no reflection)
kotlinxCoroutines = "1.11.0"        # Structured concurrency for all IO/SSE work

# --- Images ---
coil = "3.5.0"                     # Async image loading for album art / station favicons (Compose)
palette = "1.0.0"                  # Extract a dominant color from album art for dynamic theming

# --- Local persistence (favorites: mirrors web localStorage wr-favs / wr-favs-data) ---
datastore = "1.2.1"                # Preferences DataStore; favorites stored as serialized JSON

# --- Home-screen widget ---
glance = "1.1.1"                   # Jetpack Glance app widget (Compose-style, no RemoteViews/XML)

# --- Test ---
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

[libraries]
# AndroidX core / lifecycle / activity
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }

# Compose (versions come from the BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Media3
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }

# Networking + JSON
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-sse = { group = "com.squareup.okhttp3", name = "okhttp-sse", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# Images
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
androidx-palette = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }

# Persistence
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Glance widget
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
